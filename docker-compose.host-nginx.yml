services:
  server:
    build: ./apps/server
    env_file:
      - env/production.env.example
    ports:
      - "127.0.0.1:4000:4000"
    restart: always
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: dockship
      POSTGRES_PASSWORD: dockship
      POSTGRES_DB: dockship
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: always

volumes:
  postgres-data:
