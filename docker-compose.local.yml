services:
  server:
    build: ./apps/server
    env_file:
      - env/local.env.example
    ports:
      - "4000:4000"
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: dockship
      POSTGRES_PASSWORD: dockship
      POSTGRES_DB: dockship
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7

volumes:
  postgres-data:
